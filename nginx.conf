# Nginx du conteneur frontend : sert le build React (SPA) et relaie /api vers Flask.
# Ce fichier est un template : au démarrage, l'image nginx remplace ${BACKEND_URL},
# ${GRAFANA_URL} et ${NGINX_LOCAL_RESOLVERS} (DNS du conteneur : Docker ou Kubernetes).
# (Équivalent du proxy Vite en développement : le navigateur ne parle qu'à une seule origine,
#  donc pas de problème de CORS.)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Taille maximale d'un envoi (import CSV de produits : 2 Mo côté API)
  client_max_body_size 3m;

  # DNS du conteneur : Grafana est résolu à la demande (Nginx démarre même sans lui)
  resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tableau de supervision (Grafana servi sous /grafana/, connexion obligatoire)
  location /grafana/ {
    set $grafana ${GRAFANA_URL};
    proxy_pass $grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Grafana Live (WebSocket)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
